name: PR Title Check

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-title-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  title:
    name: Shared PR title
    uses: Gambit-Defense/Automation/.github/workflows/pr-title.yml@v1

  # Organization rules require this exact check name.
  validate-pr-title:
    name: Validate PR Title
    needs: title
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful shared title validation
        env:
          RESULT: ${{ needs.title.result }}
        run: |
          printf 'Shared title validation result: %s\n' "$RESULT"
          test "$RESULT" = success
